<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiny Swords - Jogo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #game-container {
            position: relative;
        }
        canvas {
            background-color: #1a1a1a;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            image-rendering: pixelated;
        }
        #ui {
            position: fixed;
            top: 10px; left: 10px;
            background: url('game_assets/ui_banner.png') no-repeat center center;
            background-size: 100% 100%;
            padding: 30px 40px;
            color: #333;
            text-shadow: none;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            pointer-events: none;
            width: 350px;
            text-align: center;
            z-index: 1000;
        }
        #ui h2 { margin-top: 0; font-size: 20px; color: #500; }
        #ui p { font-size: 14px; margin: 5px 0; }

        /* Controles Mobile */
        #mobile-controls {
            display: none;
            position: fixed;
            bottom: 30px;
            left: 0;
            right: 0;
            pointer-events: none;
            z-index: 1000;
        }
        @media (max-width: 800px), (pointer: coarse) {
            #mobile-controls {
                display: flex;
                justify-content: space-between;
                padding: 0 20px;
            }
            #ui { font-size: 14px; top: 5px; }
        }

        .joy-container {
            width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.15);
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            position: relative;
            pointer-events: auto;
            touch-action: none;
        }
        .joy-knob {
            width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        .action-buttons {
            display: flex; gap: 15px; align-items: flex-end; pointer-events: auto;
        }
        .btn-action {
            width: 65px; height: 65px;
            background: rgba(255, 255, 255, 0.15);
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            color: white; font-size: 28px;
            display: flex; justify-content: center; align-items: center;
            user-select: none;
            touch-action: none;
        }
        .btn-action.btn-large {
            width: 85px; height: 85px; font-size: 38px;
        }
        .btn-action:active { background: rgba(255,255,255,0.5); }

        #character-select {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .char-btn {
            background: #444; border: 3px solid #fff; border-radius: 10px;
            color: white; padding: 20px 40px; font-size: 24px; cursor: pointer;
            margin: 10px; transition: transform 0.2s;
        }
        .char-btn:hover { transform: scale(1.1); background: #666; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div id="character-select">
            <h1 style="font-size: 40px; margin-bottom: 40px; text-shadow: 2px 2px 0 #000;">Escolha seu Herói</h1>
            <div style="display: flex; flex-wrap: wrap; justify-content: center;">
                <button class="char-btn" onclick="startGame('knight')">🛡️ Cavaleiro<br><span style="font-size:16px">(Corpo-a-corpo)</span></button>
                <button class="char-btn" onclick="startGame('mage')">🔮 Mago<br><span style="font-size:16px">(Ataque Mágico a Distância)</span></button>
            </div>
        </div>

        <div id="ui" style="display: none;">
            <h2>Tiny Swords - Aventura</h2>
            <p>Controles: WASD para andar | E curar | Clique para atacar</p>
            <p><strong>Goblins:</strong> <span id="score">0</span> | <strong>Ouro:</strong> <span id="ui-gold">0</span> | <strong>Madeira:</strong> <span id="ui-wood">0</span></p>
        </div>
        <div id="mobile-controls">
            <div class="joy-container" id="joystick-zone">
                <div class="joy-knob" id="joystick-knob"></div>
            </div>
            <div class="action-buttons">
                <div class="btn-action" id="btn-heal">❤️</div>
                <div class="btn-action btn-large" id="btn-attack">⚔️</div>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
