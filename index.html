<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tiny Swords - Jogo</title>
    <style>
        body { margin: 0; padding: 0; background-color: #222; overflow: hidden; touch-action: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        canvas { background-color: #1a1a1a; image-rendering: pixelated; }
        
        #character-select { position: fixed; top:0; left:0< width:100%; height:100%; background: rgba(0,0,0,0.85); z-index: 2000; display:flex; flex-direction:column; align-items:center; justify-content:center; color: white; text-align:center; }
        .char-btn { background:#444; border:3px solid #fff; border-radius:10px; color:white; padding:20px 40px; font-size:24px; cursor:pointer; margin:10px; transition:transform 0.2s; }
        .char-btn:hover { transform: scale(1.1); background:#666; }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); color: #fff; }
            100% { transform: scale(1); }
        }
        .pop-anim { animation: pop 0.2s ease-out; }
        
        #hud-top-left {
            position: fixed; top: 20px; left: 20px; z-index: 1000;
            display: flex; align-items: center;
            background: rgba(20, 50, 70, 0.6);
            border: 2px solid rgba(100, 200, 255, 0.4);
            border-radius: 30px;
            padding: 5px 15px 5px 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .hp-icon { font-size: 28px; margin-right: 10px; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5)); }
        .hp-bar-container {
            width: 150px; height: 18px;
            background: rgba(0,0,0,0.5);
            border-radius: 10px; overflow: hidden;
            border: 2px solid rgba(255,255,255,0.2);
        }
        .hp-bar-fill {
            height: 100%; width: 100%;
            background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%);
            border-radius: 8px;
            transition: width 0.2s ease-out;
        }

        #hud-top-right {
            position: fixed; top: 20px; right: 20px; z-index: 1000;
            display: flex; gap: 10px;
        }
        .res-box {
            background: rgba(30, 40, 30, 0.8);
            border: 2px solid #556; border-radius: 10px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 60px; height: 70px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
        }
        .res-icon { width: 40px; height: 40px; background-size: 280px 40px; image-rendering: pixelated; }
        .res-gold { background-image: url('game_assets/gold.png'); }
        .res-wood { background-image: url('game_assets/wood.png'); }
        .res-meat { background-image: url('game_assets/meat.png'); }
        .res-value { color: #fff; font-weight: bold; font-size: 14px; margin-top: 2px; text-shadow: 1px 1px 2px #000; transition: transform 0.1s; }

        #build-btn-container { position: fixed; bottom: 30px; right: 30px; z-index: 1000; }
        #build-menu {
            display: none; position: absolute; bottom: 90px; right: 0;
            background: rgba(40, 50, 60, 0.95);
            padding: 15px; border-radius: 15px; border: 3px solid #789;
            width: 200px; box-shadow: 0 8px 16px rgba(0,0,0,0.6);
            transform-origin: bottom right; animation: slideUp 0.2s ease-out;
        }
        @keyframes slideUp { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        
        .build-option {
            width: 100%; margin-bottom: 10px; padding: 12px;
            background: linear-gradient(180deg, #567, #345);
            color: white; border: 2px solid #89a; border-radius: 8px;
            cursor: pointer; text-align: left; font-size: 15px; font-weight: bold;
            transition: filter 0.1s, transform 0.1s;
        }
        .build-option:active { filter: brightness(1.2); transform: scale(0.95); }
        .build-option span { color: #ffd700; font-size: 12px; float: right; display: flex; flex-direction: column; align-items: flex-end;}

        #toggle-build-btn {
            width: 80px; height: 80px; border-radius: 50%;
            background: #e4c79f; border: 5px solid #5a3c20;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; box-shadow: 0 6px 0 #3a2210, 0 10px 15px rgba(0,0,0,0.5);
            transition: transform 0.1s, box-shadow 0.1s, margin-top 0.1s;
        }
        #toggle-build-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #3a2210, 0 5px 8px rgba(0,0,0,0.5); }
        .build-icon-inner {
            width: 56px; height: 56px; border-radius: 50%;
            background: #4a80b0; display: flex; justify-content: center; align-items: center;
            font-size: 28px; border: 2px solid #2a5070;
        }

        #mobile-controls { position: fixed; bottom: 40px; left: 40px; z-index: 1000; }
        .joy-container {
            width: 150px; height: 150px; background: rgba(255, 255, 255, 0.15);
            border: 4px solid rgba(255, 255, 255, 0.3); border-radius: 50%; position: relative; touch-action: none; box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }
        .joy-knob {
            width: 65px; height: 65px; background: rgba(255, 255, 255, 0.8);
            border-radius: 50%; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); pointer-events: none; box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div id="character-select">
            <h1 style="font-size: 40px; margin-bottom: 40px; text-shadow: 2px 2px 0 #000;">Escolha seu Herói</h1>
            <div style="display: flex; flex-wrap: wrap; justify-content: center;">
                <button class="char-btn" onclick="startGame('knight')">⚔>️ Cavaleiro<br><span style="font-size:16px">(Corpo-a-corpo)</span></button>
                <button class="char-btn" onclick="startGame('mage')">🗮 Mago<br><span style="font-size:16px">(Ataque Mágico)</span></button>
            </div>
        </div>

        <div id="hud-top-left" style="display: none;">
            <div class="hp-icon">📖</div>
            <div class="hp-bar-container">
                <div class="hp-bar-fill" id="ui-hp-fill"></div>
            </div>
        </div>

        <div id="hud-top-right" style="display: none;">
            <div class="res-box">
                <div class="res-icon res-gold"></div>
                <div class="res-value" id="ui-gold">0</div>
            </div>
            <div class="res-box">
                <div class="res-icon res-wood"></div>
                <div class="res-value" id="ui-wood">0</div>
            </div>
            <div class="res-box">
                <div class="res-icon res-meat"></div>
                <div class="res-value" id="ui-score">0</div>
            </div>
        </div>

        <div id="build-btn-container" style="display: none;">
            <div id="build-menu">
                <h3 style="margin-top:0; color: #fff; text-align: center; font-size: 16px;">Construir</h3>
                <button class="build-option" onclick="window.placeBlueprint('tower')">
                    Torre <span>20🥵<br>10🎨</span>
                </button>
                <button class="build-option" onclick="window.placeBlueprint('castle')">
                    Castelo <span>50🥵<br>50🎨</span>
                </button>
            </div>
            <div id="toggle-build-btn" onclick="const m = document.getElementById('build-menu'); m.style.display = m.style.display === 'none' || m.style.display === '' ? 'block' : 'none';">
                <div class="build-icon-inner">🔦</div>
            </div>
        </div>

        <div id="mobile-controls" style="display: none;">
            <div class="joy-container" id="joystick-zone">
                <div class="joy-knob" id="joystick-knob"></div>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
