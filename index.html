<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiny Swords - Jogo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #game-container {
            position: relative;
        }
        canvas {
            background-color: #1a1a1a;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            image-rendering: pixelated;
        }
        #ui {
            position: fixed;
            top: 10px; left: 10px;
            background: url('game_assets/ui_banner.png') no-repeat center center;
            background-size: 100% 100%;
            padding: 30px 40px;
            color: #333;
            text-shadow: none;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            pointer-events: none;
            width: 350px;
            text-align: center;
            z-index: 1000;
        }
        #ui h2 { margin-top: 0; font-size: 20px; color: #500; }
        #ui p { font-size: 14px; margin: 5px 0; }

        /* Controles Mobile */
        #mobile-controls {
            display: none;
            position: fixed;
            bottom: 30px;
            left: 0;
            right: 0;
            pointer-events: none;
            z-index: 1000;
        }
        @media (max-width: 800px), (pointer: coarse) {
            #mobile-controls {
                display: flex;
                justify-content: space-between;
                padding: 0 20px;
            }
            #ui { font-size: 14px; top: 5px; }
        }

        .joy-container {
            width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.15);
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            position: relative;
            pointer-events: auto;
            touch-action: none;
        }
        .joy-knob {
            width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        .action-buttons {
            display: flex; gap: 15px; align-items: flex-end; pointer-events: auto;
        }
        .btn-action {
            width: 65px; height: 65px;
            background: rgba(255, 255, 255, 0.15);
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            color: white; font-size: 28px;
            display: flex; justify-content: center; align-items: center;
            user-select: none;
            touch-action: none;
        }
        .btn-action.btn-large {
            width: 85px; height: 85px; font-size: 38px;
        }
        .btn-action:active { background: rgba(255,255,255,0.5); }

        #character-select {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .char-btn {
            background: #444; border: 3px solid #fff; border-radius: 10px;
            color: white; padding: 20px 40px; font-size: 24px; cursor: pointer;
            margin: 10px; transition: transform 0.2s;
        }
        .char-btn:hover { transform: scale(1.1); background: #666; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div id="character-select">
            <h1 style="font-size: 40px; margin-bottom: 40px; text-shadow: 2px 2px 0 #000;">Escolha seu Herói</h1>
            <div style="display: flex; flex-wrap: wrap; justify-content: center;">
                <button class="char-btn" onclick="startGame('knight')">🛡️ Cavaleiro<br><span style="font-size:16px">(Corpo-a-corpo)</span></button>
                <button class="char-btn" onclick="startGame('mage')">🔮 Mago<br><span style="font-size:16px">(Ataque Mágico a Distância)</span></button>
            </div>
        </div>
        <!-- Nova HUD no topo direito -->
        <div id="hud-top-right" style="display: none; position: fixed; top: 15px; right: 20px; background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 10px; border: 2px solid #555; pointer-events: none; z-index: 1000; font-size: 20px; font-weight: bold; text-shadow: 1px 1px 2px black;">
            <div style="display:flex; align-items:center; margin-bottom: 5px;">
                <span style="color:#ff4444; width: 30px;">HP</span> 
                <span id="ui-hp">100%</span>
            </div>
            <div style="display:flex; align-items:center; margin-bottom: 5px;">
                <span style="color:#ffd700; width: 30px;">Ouro</span> 
                <span id="ui-gold">0</span>
            </div>
            <div style="display:flex; align-items:center;">
                <span style="color:#8b4513; width: 30px;">Mad</span> 
                <span id="ui-wood">0</span>
            </div>
        </div>

        <!-- Menu Inventario -->
        <div id="build-btn-container" style="display: none; position: fixed; bottom: 30px; right: 30px; z-index: 1000;">
            <div id="build-menu" style="display: none; background: rgba(0,0,0,0.85); padding: 15px; border-radius: 10px; border: 2px solid #888; margin-bottom: 15px;">
                <h3 style="margin-top:0; color: #fff; text-align: center; font-size: 16px;">Inventario / Construir</h3>
                <button onclick="window.placeBlueprint('tower')" style="width: 100%; margin-bottom: 10px; padding: 10px; background: #333; color: white; border: 1px solid #555; border-radius: 5px; cursor: pointer; text-align: left; font-size: 16px;">
                    Torre <span style="color:#aaa; font-size:14px; float:right;">20 Mad / 10 Ouro</span>
                </button>
                <button onclick="window.placeBlueprint('castle')" style="width: 100%; padding: 10px; background: #333; color: white; border: 1px solid #555; border-radius: 5px; cursor: pointer; text-align: left; font-size: 16px;">
                    Castelo <span style="color:#aaa; font-size:14px; float:right;">50 Mad / 50 Ouro</span>
                </button>
            </div>
            <button id="toggle-build-btn" onclick="document.getElementById('build-menu').style.display = document.getElementById('build-menu').style.display === 'none' ? 'block' : 'none'" style="width: 70px; height: 70px; border-radius: 50%; background: #4caf50; border: 3px solid #2e7d32; color: white; font-size: 16px; display: flex; justify-content: center; align-items: center; cursor: pointer; float: right; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
                Construir
            </button>
        </div>

        <div id="mobile-controls">
            <div class="joy-container" id="joystick-zone">
                <div class="joy-knob" id="joystick-knob"></div>
            </div>
            <div class="action-buttons">
                <div class="btn-action" id="btn-heal">❤️</div>
                <div class="btn-action btn-large" id="btn-attack">⚔️</div>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
